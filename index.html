<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal de Processos — EngePro</title>
  <!-- a engrenagem do "Pro" -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312163A'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%23fff' stroke-width='4.6' stroke-dasharray='3.6 3.86'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%2312163A'/%3E%3C/svg%3E">
  <link rel="preload" href="libs/engepro/fonts/ultra-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="libs/engepro/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="libs/engepro/fonts/poppins-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="libs/engepro/portal.css">
</head>

<body>
<div class="app">

  <!-- ===== cabeçalho: título à esquerda, as duas marcas juntas à direita ===== -->
  <header class="header">
    <button class="tool menu-btn" id="menuBtn" title="Menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="header-titles">
      <div class="header-kicker" id="projeto">Mapeamento de Processos</div>
      <div class="header-title">Portal de Processos</div>
    </div>
    <div class="brands">
      <div class="brand-block">
        <div id="brandSlot"></div>
      </div>
      <div class="client">
        <div id="clientSlot"></div>
      </div>
    </div>
  </header>

  <!-- ===== navegação (as três abas) ===== -->
  <nav class="nav" id="nav"></nav>

  <!-- ===== conteúdo ===== -->
  <main class="main">

    <!-- ---------- BPMN ---------- -->
    <section class="view" id="view-bpmn">
      <div class="toolbar">
        <div class="crumbs" id="bpmnCrumbs"></div>
        <div class="tools" id="bpmnTools">
          <button class="tool" data-act="out" title="Reduzir (−)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-3.7-3.7"/></svg>
          </button>
          <span class="zoom-level" id="bpmnZoom">100%</span>
          <button class="tool" data-act="in" title="Ampliar (+)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M20 20l-3.7-3.7"/></svg>
          </button>
          <span class="tool-sep"></span>
          <button class="tool wide" data-act="fit" title="Ajustar à tela (0)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V4.5A1.5 1.5 0 014.5 3H8m8 0h3.5A1.5 1.5 0 0121 4.5V8m0 8v3.5a1.5 1.5 0 01-1.5 1.5H16M8 21H4.5A1.5 1.5 0 013 19.5V16"/></svg>
            Ajustar
          </button>
          <button class="tool" data-act="full" title="Tela cheia">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H4.5A1.5 1.5 0 003 4.5V8m13-5h3.5A1.5 1.5 0 0121 4.5V8M3 16v3.5A1.5 1.5 0 004.5 21H8m8 0h3.5a1.5 1.5 0 001.5-1.5V16"/></svg>
          </button>
        </div>
      </div>

      <div class="stage" id="bpmnStage">
        <div class="canvas" id="bpmnCanvas"></div>
        <div class="loader" id="bpmnLoader">
          <svg class="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 003.6 8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H8a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V8a1.6 1.6 0 001.5 1H22a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>
          <span class="loader-cap">Taokei…</span>
        </div>
        <div class="stage-hint gone" id="bpmnHint">
          <span>Arraste para mover · role para dar zoom · <kbd>duplo clique</kbd> ajusta</span>
        </div>
      </div>
    </section>

    <!-- ---------- SIPOC ---------- -->
    <section class="view sipoc-view" id="view-sipoc">
      <div class="toolbar">
        <div class="crumbs" id="sipocCrumbs"></div>
        <div class="tools" id="sipocTools">
          <button class="tool" data-act="prev" title="Anterior (←)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button class="tool" data-act="next" title="Próximo (→)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </button>
          <span class="tool-sep"></span>
          <button class="tool wide" data-act="print" title="Imprimir / salvar em PDF">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8V3h10v5M7 18H5a2 2 0 01-2-2v-4a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2h-2"/><rect x="7" y="14" width="10" height="7" rx="1"/></svg>
            Imprimir
          </button>
          <button class="tool" data-act="full" title="Tela cheia">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H4.5A1.5 1.5 0 003 4.5V8m13-5h3.5A1.5 1.5 0 0121 4.5V8M3 16v3.5A1.5 1.5 0 004.5 21H8m8 0h3.5a1.5 1.5 0 001.5-1.5V16"/></svg>
          </button>
        </div>
      </div>

      <div class="sipoc-stage" id="sipocStage"></div>

      <!-- seletor de baixo -->
      <div class="filmstrip">
        <div class="strip-nav">
          <button class="tool" id="stripPrev" title="Anterior">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
        </div>
        <div class="strip-scroll" id="strip"></div>
        <div class="strip-nav">
          <button class="tool" id="stripNext" title="Próximo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ---------- VSM ---------- -->
    <section class="view" id="view-vsm"></section>

  </main>
</div>

<!-- O modelo BPMN vem do arquivo que o próprio Bizagi gera.
     Republicar pelo Bizagi atualiza os diagramas aqui automaticamente. -->
<script>window.Bizagi = window.Bizagi || {};</script>
<script src="libs/js/json/configuration.json.js"></script>

<script src="libs/engepro/data.js"></script>
<script src="libs/engepro/portal.js"></script>
</body>
</html>
